<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B567B">
<title>Spiele der Mathe-Flüsterin</title>
<style>
/* Schrift Fredoka (SIL Open Font License, siehe fonts/OFL.txt), lokal eingebunden. */
@font-face { font-family: "Fredoka"; font-weight: 300 700; font-style: normal; font-display: swap; src: url(fonts/fredoka-latin.woff2) format("woff2"); }
:root { color-scheme: light; --gold: #FFC82B; --blue: #0B567B; --cream: #FBFAF1; --ink: #0B3A52; --ink-soft: #4d6f80; --font: "Fredoka", "Trebuchet MS", system-ui, sans-serif; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--cream); color: var(--ink); font-family: var(--font); }
main { max-width: 560px; margin: 0 auto; padding: 32px 16px 48px; box-sizing: border-box; }
h1 { margin: 0 0 6px; font-size: 32px; font-weight: 700; color: var(--blue); text-wrap: balance; }
.lead { margin: 0 0 24px; color: var(--ink-soft); font-size: 17px; line-height: 1.45; }
.games { display: grid; gap: 14px; padding: 0; margin: 0; list-style: none; }
.game { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; align-items: center; padding: 16px; border: 3px solid var(--blue); border-radius: 20px; background: #fff; color: inherit; text-decoration: none; }
.game:hover { background: var(--gold); border-color: var(--gold); }
.game:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.game img { width: 64px; height: 64px; border-radius: 14px; grid-row: 1 / span 2; }
.game b { font-size: 22px; color: var(--blue); }
.game span { font-size: 15px; line-height: 1.4; }
</style>
</head>
<body>
<main>
  <h1>Spiele der Mathe-Flüsterin</h1>
  <p class="lead">Lernspiele für Kinder. Ohne Werbung, ohne Anmeldung.</p>
  <ul class="games">
    <li><a class="game" href="verliebte-zahlen/">
      <img src="verliebte-zahlen/icon-192.png" alt="" width="64" height="64">
      <b>Verliebte Zahlen</b>
      <span>Finde Zahlen, die zusammen 10 ergeben, und übe dabei das Zahlenpaar-Einmaleins. Für Grundschulkinder.</span>
    </a></li>
  </ul>
</main>
</body>
</html>
